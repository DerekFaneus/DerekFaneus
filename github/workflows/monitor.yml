name: Monitor sites

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch: {}       # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer les vérifications
        run: node scripts/check.mjs

      - name: Commit les résultats
        run: |
          git config user.name "uptimewatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json data/latest.json
          if git diff --cached --quiet; then
            echo "Aucun changement à commit."
          else
            git commit -m "chore: mise à jour automatique des données de monitoring"
            git push
          fi
